# Config do projeto Supabase local. Equivalente ao painel, em codigo.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "arven-solutions"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.contracts]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/pdf"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.email]
# Provider de email habilitado (magic link e admin-issued passwords passam por aqui).
# Self-signup ja esta proibido no nivel [auth] acima, entao habilitar aqui nao
# abre porta pra criacao de conta publica.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Seu link de acesso, Arven"
content_path = "./supabase/templates/magic-link.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false

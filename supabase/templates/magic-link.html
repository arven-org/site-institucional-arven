<!doctype html>
<html lang="pt-BR">
  <body
    style="margin: 0; padding: 40px 24px; background: #0a0a0c; color: #f5f5f7; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;"
  >
    <div style="max-width: 480px; margin: 0 auto;">
      <p style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #8b8b95; margin: 0 0 8px;">
        Arven
      </p>
      <h1 style="font-size: 24px; margin: 0 0 16px; font-weight: 600;">Seu link de acesso</h1>
      <p style="color: #b8b8c0; line-height: 1.55; margin: 0 0 24px;">
        Clique pra entrar. O link expira em 10 minutos e funciona uma unica vez.
      </p>
      <p style="margin: 0 0 24px;">
        <a
          href="{{ .ConfirmationURL }}"
          style="display: inline-block; padding: 12px 20px; background: #e6b566; color: #1a1208; text-decoration: none; border-radius: 8px; font-weight: 500;"
        >
          Entrar na plataforma
        </a>
      </p>
      <p style="color: #6b6b75; font-size: 13px; line-height: 1.55; margin: 0;">
        Se voce nao pediu, ignore este email. Ninguem entra na sua conta sem clicar.
      </p>
    </div>
  </body>
</html>
